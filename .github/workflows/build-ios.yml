name: Diagnose Oxyvra Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Show Environment
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Inspect Build Output
        run: |
          echo "===== ROOT ====="
          ls -la

          for dir in dist .output build public; do
            if [ -d "$dir" ]; then
              echo ""
              echo "===== $dir ====="
              du -sh "$dir" || true
              find "$dir" -maxdepth 3 -type f | head -100
            fi
          done
