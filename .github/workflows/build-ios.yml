name: Test Oxyvra iOS Cloud Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Project
        run: npm run build

      - name: Create Temporary Capacitor Placeholder
        run: |
          mkdir -p public
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <title>Oxyvra</title>
            </head>
            <body>
              <p>Oxyvra</p>
            </body>
          </html>
          EOF

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Resolve iOS Packages
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
