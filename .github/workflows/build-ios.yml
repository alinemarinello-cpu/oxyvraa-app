name: Diagnose Oxyvra Packaging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Locate Capacitor Web App
        run: |
          echo "========== POSSIBLE INDEX FILES =========="
          find . \
            -path './node_modules' -prune -o \
            -type f -name 'index.html' -print

          echo ""
          echo "========== EXPECTED LOCATIONS =========="

          for file in \
            public/index.html \
            dist/index.html \
            dist/client/index.html \
            .output/public/index.html
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done

          echo ""
          echo "========== .OUTPUT =========="
          find .output -maxdepth 3 -print 2>/dev/null | sort | head -250

          echo ""
          echo "========== DIST =========="
          find dist -maxdepth 3 -print 2>/dev/null | sort | head -250

          echo ""
          echo "========== PUBLIC =========="
          find public -maxdepth 2 -print 2>/dev/null | sort | head -100
