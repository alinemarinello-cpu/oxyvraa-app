name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor
        run: |
          npx cap init Oxyvra com.oxyvra.app --web-dir dist
          npx cap add ios
          npx cap sync ios